[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-layer"
version = "0.1.0"
description = "Sentinel Layer: unified LLM governance platform (red-teaming, output integrity, model fingerprinting)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "flask>=3.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
